    function copaStatsHtml(){const T='PROVINCIAL';const logs=state.rawLogs.filter(l=>l.temporada===state.season&&l.torneo===T);if(!logs.length)return '';const key=l=>`${l.competencia}|${l.fecha}`;const fechas=[...new Set(logs.map(key))];const by={};logs.forEach(l=>{const p=by[l.jugador]=by[l.jugador]||{name:l.jugador,team:l.equipo,pts:0,n:0,min:99,max:0,capPts:0,capN:0};p.pts+=l.puntos;p.n++;p.min=Math.min(p.min,l.puntos);p.max=Math.max(p.max,l.puntos);if(l.equipo&&l.equipo!=='LIBRE')p.team=l.equipo;if(l.capitan&&l.equipo!=='LIBRE'){p.capPts+=l.suma;p.capN++;}});const ps=Object.values(by);const names=list=>{const n=list.map(x=>escape(x.name||x));return n.length>2?`${n.slice(0,2).join(', ')} y ${n.length-2} más`:n.join(' y ');};const top=(arr,f)=>{const m=Math.max(...arr.map(f));return [m,arr.filter(x=>f(x)===m)];};const items=[];

    function evolutionChart(points){if(!points.length)return '<p class="sub">Sin fechas registradas esta temporada.</p>';const n=points.length;const narrow=window.matchMedia('(max-width:700px)').matches;const W=narrow?Math.max(330,n*26):Math.max(640,n*20),H=narrow?200:220,L=30,R=16,T=22,B=28;const max=Math.max(1,...points.map(p=>p.value));const top=max<=10?Math.ceil(max/2)*2:Math.ceil(max/5)*5;const x=i=>n===1?(L+W-R)/2:L+(W-L-R)*i/(n-1);const y=v=>T+(H-T-B)*(1-v/top);const avg=points.reduce((sum,p)=>sum+p.value,0)/n;const step=!narrow&&n>24?2:1;const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#edf0ed"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#71807c">${Math.round(v)}</text>`).join('');const separators=points.map((p,i)=>i>0&&p.torneo!==points[i-1].torneo?`<line x1="${(x(i)+x(i-1))/2}" x2="${(x(i)+x(i-1))/2}" y1="${T-8}" y2="${H-B}" stroke="#c9d3ce" stroke-dasharray="2 3"/>`:'').join('');const line=n>1?`<polyline fill="none" stroke="#17734d" stroke-width="2" stroke-linejoin="round" points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ')}"/>`:'';const avgLine=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="#b7791f" stroke-dasharray="5 4" stroke-width="1.2"/>`;const dots=points.map((p,i)=>`<g class="chart-pt" data-tip="${attr(p.title)}"><circle class="hit" cx="${x(i)}" cy="${y(p.value)}" r="11" fill="transparent"/><circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="3.6" fill="#fff" stroke="#17734d" stroke-width="2"/><text x="${x(i)}" y="${y(p.value)-8}" text-anchor="middle" font-size="${n>30?9:10}" fill="#1d2a27">${p.value}</text></g>`).join('');const labels=points.map((p,i)=>(n-1-i)%step===0?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#71807c">${escape(p.label)}</text>`:'').join('');return `<div class="chart-wrap${narrow&&W>330?' many':''}" style="--minw:${W}px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos por fecha">${gri     const DEFAULT_RULES=[{"titulo": "Cómo se juega", "texto": "Cada fecha, el jugador selecciona LOCAL, EMPATE o VISITA en 10 partidos.\nEn uno de esos 10 partidos debe seleccionar 2 opciones posibles. Ej.: LOCAL / EMPATE.\n- 1 punto por cada acierto, con un máximo de 10 puntos por fecha.\n- En el partido con doble opción, el acierto cuenta si sale cualquiera de las dos."}, {"titulo": "Cierre, suspensiones y jugadas", "texto": "Cierre de predicciones: todos los sábados a las 13:00 horas. En caso de alguna excepción, se avisará en el grupo de WhatsApp.\nPartidos suspendidos o postergados: la fecha queda en suspenso hasta que se complete el o los partidos suspendidos.\nMás de una jugada por persona: si un jugador envía 2 predicciones, se computan como \"Jugador Ejemplo\" y \"Jugador Ejemplo 2\". Cada predicción es un jugador distinto."}, {"titulo": "Premios semanales", "texto": "Cada jugador compite cada semana por premios en efectivo o jugadas gratis:\n- 10 pts: $550.000 (se divide entre los jugadores con el mismo puntaje)\n- 9 pts: $250.000 (se divide entre los jugadores con el mismo puntaje)\n- 8 pts: $100.000 (se divide entre los jugadores con el mismo puntaje)\n- 7 pts: Jugada gratis\nTerminada la fecha, se sube la información al grupo de WhatsApp con los datos y los nombres de los ganadores (si los hubo).\nLos ganadores deben comunicarse por privado con el administrador del grupo para cobrar el premio que les corresponda."}, {"titulo": "Torneos individuales", "texto": "Cada jugador del prode compite individualmente con su puntaje en distintos torneos. Para una mejor organización, los torneos llevan el nombre del torneo que se juega en ese momento en la Liga Pampeana:\n- APERTURA (primera mitad del año): camiseta actual de Primera División.\n- CLAUSURA (segunda mitad del año): camiseta actual de Primera División.\n- PROVINCIAL (final del año): camiseta actual de Primera División + cena para 2 personas en la sede.\n- ANUAL (tabla que suma los 3 anteriores): voucher de sponsor."}, {"titulo": "Desempate individual", "texto": "En caso de empate en puntos de 2 o más jugadores en la primera posición, se aplican los siguientes criterios:\n1) Más fechas ganadas (si dos o más jugadores comparten el puntaje más alto de una fecha, la fecha cuenta como ganada para todos ellos).\n2) Más partidos ganados entre sí (cada fecha que jugaron los empatados es un partido entre ellos: lo gana el que hizo más puntos; si empatan, no cuenta).\n3) Mejor fecha (mayor puntaje obtenido en una sola fecha del torneo)."}, {"titulo": "Modalidad en equipos", "texto": "Un equipo se conforma con 5 jugadores que se agrupan para sumar juntos fecha tras fecha.\nEligen un nombre (recomendamos que sea el nombre de un negocio local).\nDeben designar un CAPITÁN, que sumará su puntaje x2 (ej.: si el capitán hace 5 pts, suma 10 para el equipo).\nEl capitán puede cambiar fecha a fecha, siempre y cuando el cambio se le comunique al administrador del grupo de WhatsApp antes del cierre de predicciones."}, {"titulo": "Apertura, Clausura y Anual de equipos", "texto": "- APERTURA (primera mitad del año): el campeón pasa a la final.\n- CLAUSURA (segunda mitad del año): el campeón pasa a la final.\n- ANUAL: final de ida y vuelta entre el campeón del Apertura y el campeón del Clausura. Si el mismo equipo gana el Apertura y el Clausura, es el campeón anual y no se juega la final.\nCriterios de desempate del Apertura y el Clausura: 1) Puntos totales, 2) Más fechas ganadas, 3) Mejor fecha."}, {"titulo": "Provincial de equipos", "texto": "🏆 Fase regular (6 fechas): todos los equipos suman puntos en una única tabla general.\nCriterios de desempate: 1) Puntos totales, 2) Más fechas ganadas, 3) Mejor fecha.\n🔥 Playoffs (cruces mano a mano): al finalizar la fecha 6, los 8 mejores clasificados pasan a los playoffs. Los cruces se juegan con partidos de ida y vuelta:\n- 1° vs. 8°\n- 3° vs. 6°\n- 4° vs. 5°\n- 2° vs. 7°\nEn caso de empate en puntos después de los partidos de ida y vuelta, pasa de ronda el equipo mejor ubicado en la tabla de la fase regular."}, {"titulo": "Premios por equipo", "texto": "- APERTURA: clasifica a la final del torneo Anual.\n- CLAUSURA: clasifica a la final del torneo Anual.\n- ANUAL: cena para los 5 integrantes del equipo en la sede del club.\n- PROVINCIAL: cena para los 5 integrantes del equipo en la sede del club, más un objeto de reconocimiento simbólico."}, {"titulo": "Cláusula final", "texto": "Cualquier situación no prevista en este reglamento será resuelta por la organización."}];
    function rulesText(text){const lines=String(text).split(/\n+/).map(line=>line.trim()).filter(Boolean);let html='',list='';const flush=()=>{if(list){html+=list+'</ul>';list='';}};lines.forEach(line=>{const item=line.match(/^(?:[-•*]|\d+[).])\s*(.*)$/);if(item){if(!list)list=/^\d/.test(line)?'<ul class="num">':'<ul>';list+=`<li>${escape(line.match(/^\d/)?line:item[1])}</li>`;}else{flush();const label=line.match(/^([^:]{3,55}):\s+(.*)$/);html+=label?`<p><b>${escape(label[1])}:</b> ${escape(label[2])}</p>`:`<p>${escape(line)}</p>`;}});flush();return html;}

    function modalHtml(title,subtitle,content){return `<div class="modal-head"><div><h2>${escape(title)}</h2><p>${subtitle}</p></div><button class="close" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button></div><div class="modal-body">${content}</div>`;}
    function scKey(l){return `${l.torneo}|${l.competencia}|${l.fecha}`;}
    function teamFechaKeys(equipo){const eq=equipo.toUpperCase();return sortFechaKeys([...new Set(state.rawLogs.filter(l=>l.temporada===state.season&&l.equipo.toUpperCase()===eq&&l.torneo).map(scKey))]);}
    function scFechaLabel(key){const [T,C,F]=key.split('|');const comps=new Set(state.rawLogs.filter(l=>l.temporada===state.season&&l.torneo===T).map(l=>l.competencia));const pretty=t=>t?t[0]+t.slice(1).toLowerCase():'';return comps.size>1?`${pretty(C)} · Fecha ${F}`:`Fecha ${F}`;}
    function cardData(equipo,key){const [T,C,Fs]=key.split('|');const F=Number(Fs);const eq=equipo.toUpperCase();const inT=l=>l.temporada===state.season&&l.torneo===T;const ord=k=>fechaOrderKey(k);const cmp=(a,b)=>{const x=ord(a),y=ord(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];};
      const teamKeys=sortFechaKeys([...new Set(state.rawLogs.filter(l=>inT(l)&&l.equipo.toUpperCase()===eq).map(scKey))]);const ti=teamKeys.indexOf(key);
      const here=state.rawLogs.filter(l=>inT(l)&&scKey(l)===key&&l.equipo.toUpperCase()===eq);if(!here.length)return null;
      const stats=name=>{const mine=state.rawLogs.filter(l=>inT(l)&&l.jugador===name);const prev=mine.filter(l=>cmp(scKey(l),key)<0);const upto=mine.filter(l=>cmp(scKey(l),key)<=0);return {avg:prev.length?prev.reduce((a,b)=>a+b.puntos,0)/prev.length:null,best:upto.length?Math.max(...upto.map(l=>l.puntos)):0,total:upto.reduce((a,b)=>a+b.puntos,0)};};
      const players=here.map(l=>{const s=stats(l.jugador);return {name:l.jugador,pts:l.puntos,suma:l.suma,cap:l.capitan,avg:s.avg===null?l.puntos:s.avg,best:s.best,total:s.total};}).sort((a,b)=>(b.cap-a.cap)||b.suma-a.suma||a.name.localeCompare(b.name));
      const present=new Set(here.map(l=>l.jugador));const before=teamKeys.slice(0,ti),after=teamKeys.slice(ti+1);const playedFor=(name,keys)=>keys.some(k=>state.rawLogs.some(l=>inT(l)&&scKey(l)===k&&l.jugador===name&&l.equipo.toUpperCase()===eq));
      const lastTeamBefore=name=>{const prev=state.rawLogs.filter(l=>inT(l)&&l.jugador===name&&cmp(scKey(l),key)<0).sort((a,b)=>cmp(scKey(b),scKey(a)));return prev.length?prev[0].equipo.toUpperCase():'';};
      const candidates=[...new Set(state.rawLogs.filter(l=>inT(l)&&l.equipo.toUpperCase()===eq&&before.includes(scKey(l))).map(l=>l.jugador))].filter(n=>!present.has(n)&&lastTeamBefore(n)===eq&&(after.length===0||playedFor(n,after)));
      const injured=candidates.slice(0,Math.max(0,6-players.length)).map(n=>{const s=stats(n);return {name:n,injured:true,avg:s.avg===null?0:s.avg,best:s.best,total:s.total};});
      const allKeysT=sortFechaKeys([...new Set(state.rawLogs.filter(inT).map(scKey))]);const isLatest=allKeysT[allKeysT.length-1]===key;const table=state.teams[T.toLowerCase()]||[];const idx=table.findIndex(r=>teamKey(r.equipo)===teamKey(equipo));
      return {team:equipo,key,total:players.reduce((a,p)=>a+p.suma,0),ctx:`${torneoName(T)} · ${scFechaLabel(key)}`,pos:isLatest&&idx>=0&&!(T==='PROVINCIAL'&&F>PROVINCIAL_FASE_REGULAR)?`${idx+1}° en la tabla`:'',jersey:jerseyUrl(equipo,true)||state.jerseys?.[teamKey(equipo)]||'',players:[...players,...injured]};}
    const SC_ARROW={up:['#7CF06A','#1FA83A','#0E6B22','M50 4 L94 50 L66 50 L66 96 L34 96 L34 50 L6 50 Z','M50 14 L80 45 L60 45 L60 60 L40 60 L40 45 L20 45 Z'],eq:['#FFE45C','#F2B705','#9C6B00','M96 50 L50 94 L50 66 L4 66 L4 34 L50 34 L50 6 Z','M86 50 L55 80 L55 60 L40 60 L40 40 L55 40 L55 20 Z'],dn:['#FF7A6B','#E0261B','#8E120B','M50 96 L94 50 L66 50 L66 4 L34 4 L34 50 L6 50 Z','M50 86 L80 55 L60 55 L60 40 L40 40 L40 55 L20 55 Z']};let scArrowId=0;
    function scArrow(c,size){if(c==='inj')return `<svg class="pes" width="${size}" height="${size}" viewBox="0 0 100 100"><rect x="7" y="7" width="86" height="86" rx="14" fill="#141414" stroke="#ffffff" stroke-width="5"/><rect x="40" y="19" width="20" height="62" rx="3" fill="#E0261B"/><rect x="19" y="40" width="62" height="20" rx="3" fill="#E0261B"/></svg>`;const [a,b,st,path,shine]=SC_ARROW[c];const id='scg'+(++scArrowId);return `<svg class="pes" width="${size}" height="${size}" viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="${path}" fill="url(#${id})" stroke="${st}" stroke-width="6" stroke-linejoin="round"/><path d="${shine}" fill="rgba(255,255,255,.28)"/></svg>`;}
    function scTrend(p){if(p.injured)return 'inj';const d=p.pts-p.avg;return d>=1?'up':d<=-1?'dn':'eq';}
    function shareCardHtml(style,d){const img=d.jersey?`<img src="${attr(d.jersey)}" crossorigin="anonymous" alt="">`:'';const ar=(p,size)=>`<span class="pes-wrap">${scArrow(scTrend(p),size)}</span>`;const hasInj=d.players.some(p=>p.injured);const legend4=`<span class="inl">${scArrow('up',26)}${scArrow('eq',26)}${scArrow('dn',26)}${hasInj?scArrow('inj',26):''}</span>`;const posTxt=d.pos?` · ${d.pos.toUpperCase()}`:'';const shown=d.players.slice(0,6);
      if(style==='cancha'){const n=shown.length;const L={1:[[50,50]],2:[[28,50],[72,50]],3:[[50,50],[26,20],[74,80]],4:[[50,50],[26,20],[74,20],[50,82]],5:[[50,50],[26,20],[74,20],[26,82],[74,82]],6:[[50,50],[24,19],[76,19],[24,82],[76,82],[50,19]]}[n]||[];return `<div class="sc sc-C"><div class="head"><div><p>${escape(d.ctx.toUpperCase())}</p><h1>${escape(d.team)}</h1></div><div class="tot"><b>${d.total}</b><span>PTS EQUIPO${escape(posTxt)}</span></div></div><div class="pitch"><div class="mid"></div><div class="circ"></div><div class="area t"></div><div class="area b"></div>${shown.map((p,i)=>`<div class="pl${p.injured?' inj':''}" style="left:${L[i][0]}%;top:${L[i][1]}%"><div class="ph">${img}${p.injured?'<span class="veil"></span>':''}<span class="pts">${p.injured?'–':(p.cap?p.suma:p.pts)}</span>${ar(p,86)}${p.cap?'<span class="cap">C</span>':''}</div><div class="nm">${escape(p.name)}</div><div class="st">${p.injured?'Lesionado · no jugó esta fecha':`Prom ${p.avg.toFixed(1)} · Mejor ${p.best} · Total ${p.total}`}</div></div>`).join('')}</div><div class="foot">${legend4} comparado con su promedio previo en el torneo${hasInj?' · lesionado: no jugó':''} · Prode Equipos All Boys</div></div>`;}
      const nm=n=>{const [a,...b]=n.split(' ');return `${escape(a)}<br>${escape(b.join(' '))}`;};const rot=[-1.5,1,-.8,1.4,-1.2,.8];
      return `<div class="sc sc-A"><div class="head">${img}<div><h1>${escape(d.team)}</h1><p>${escape(d.ctx.toUpperCase())}</p></div><div class="tot"><b>${d.total}</b><span>PTS EQUIPO${escape(posTxt)}</span></div></div><div class="grid">${shown.map((p,i)=>`<div class="card${p.injured?' inj':''}" style="transform:rotate(${rot[i%6]}deg)"><div class="photo">${img}${p.injured?'<span class="veil"></span>':''}<div class="num">${p.injured?'–':(p.cap?p.suma:p.pts)}<small>${p.injured?'LESIONADO':(p.cap?'PTS x2':'PTS')}</small></div>${ar(p,78)}${p.cap?'<span class="cap">C</span>':''}</div><div class="name">${nm(p.name)}</div><div class="stats"><div><b>${p.avg.toFixed(1)}</b>PROM</div><div><b>${p.best}</b>MEJOR</div><div><b>${p.total}</b>TOTAL</div></div></div>`).join('')}${shown.length<6?`<div class="legend"><div><span class="pes-wrap">${scArrow('up',46)}</span>Mejor que su promedio</div><div><span class="pes-wrap">${scArrow('eq',46)}</span>En su promedio</div><div><span class="pes-wrap">${scArrow('dn',46)}</span>Debajo de su promedio</div><div><span class="pes-wrap">${scArrow('inj',46)}</span>Lesionado (no jugó)</div></div>`:''}</div><div class="brand">PRODE EQUIPOS · CLUB ALL BOYS</div></div>`;}
    let scCurrent=null,scTeam='';
    function scStyle(){try{return localStorage.getItem('prode-card-style')||'figuritas';}catch(e){return 'figuritas';}}
    function scSelectors(keys,key){const torneos=[...new Set(keys.map(k=>k.split('|')[0]))];const T=key.split('|')[0];return `<div class="sc-selects"><select id="sc-torneo" onchange="changeCardTorneo(this.value)">${torneos.map(t=>`<option value="${attr(t)}"${t===T?' selected':''}>${escape(torneoName(t))}</option>`).join('')}</select><select id="sc-fecha" onchange="changeCardFecha(this.value)">${keys.filter(k=>k.startsWith(T+'|')).map(k=>`<option value="${attr(k)}"${k===key?' selected':''}>${escape(scFechaLabel(k))}</option>`).join('')}</select></div>`;}
    function lastDateDetail(equipo){scTeam=equipo;const keys=teamFechaKeys(equipo);const title='<h3>Tarjeta de la fecha</h3>';if(!keys.length)return `${title}<p class="sub">Este equipo todavía no tiene fechas cargadas esta temporada.</p>`;const sm=state.summary;const curKey=`${String(sm.torneo).toUpperCase()}|${String(sm.competencia).toUpperCase()}|${Number(sm.fecha)||0}`;const key=keys.includes(curKey)?curKey:keys[keys.length-1];const d=cardData(equipo,key);scCurrent=d;const st=scStyle();return `${title}${scSelectors(keys,key)}<div class="sc-tools"><div class="stage-tabs" id="sc-tabs"><button data-sc="figuritas" class="${st==='figuritas'?'active':''}" onclick="setCardStyle('figuritas')">Figuritas</button><button data-sc="cancha" class="${st==='cancha'?'active':''}" onclick="setCardStyle('cancha')">Cancha</button></div><button class="icon-btn sc-share" onclick="shareCardImage(this)">📷 Compartir imagen</button></div><div class="sc-preview" id="sc-preview">${d?shareCardHtml(st,d):''}</div>`;}
    function refreshCard(key){const d=cardData(scTeam,key);scCurrent=d;const box=document.getElementById('sc-preview');if(box){box.innerHTML=d?shareCardHtml(scStyle(),d):'';fitCardPreview();}}
    function changeCardTorneo(T){const keys=teamFechaKeys(scTeam).filter(k=>k.startsWith(T+'|'));const key=keys[keys.length-1];const sel=document.getElementById('sc-fecha');if(sel)sel.innerHTML=keys.map(k=>`<option value="${attr(k)}"${k===key?' selected':''}>${escape(scFechaLabel(k))}</option>`).join('');if(key)refreshCard(key);}
    function changeCardFecha(key){refreshCard(key);}
    function fitCardPreview(){const box=document.getElementById('sc-preview');if(!box)return;const card=box.firstElementChild;if(card)card.style.transform=`scale(${box.clientWidth/1080})`;}
    window.addEventListener('resize',fitCardPreview);
    function setCardStyle(st){try{localStorage.setItem('prode-card-style',st);}catch(e){}document.querySelectorAll('#sc-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.sc===st));const box=document.getElementById('sc-preview');if(box&&scCurrent){box.innerHTML=shareCardHtml(st,scCurrent);fitCardPreview();}}
    function loadScript(src){return new Promise((res,rej)=>{if(window.html2canvas){res();return;}const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
    async function renderCardCanvas(){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await document.fonts.ready;const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0;width:1080px;height:1350px;';host.innerHTML=shareCardHtml(scStyle(),scCurrent);document.body.appendChild(host);await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));try{return await html2canvas(host.firstElementChild,{width:1080,height:1350,scale:1,useCORS:true,backgroundColor:null,logging:false});}finally{host.remove();}}
    async function shareCardImage(btn){if(!scCurrent)return;const old=btn.innerHTML;btn.innerHTML='Generando…';btn.disabled=true;try{const canvas=await renderCardCanvas();const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const fname=`${jerseySlug(scCurrent.team)}-${jerseySlug(scCurrent.ctx)}.png`;const file=new File([blob],fname,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`${scCurrent.team} · ${scCurrent.ctx}`});btn.innerHTML=old;return;}catch(e){if(e&&e.name==='AbortError'){btn.innerHTML=old;return;}}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);btn.innerHTML='✓ Imagen descargada';setTimeout(()=>btn.innerHTML=old,2500);}catch(e){console.error(e);btn.innerHTML='No se pudo generar';setTimeout(()=>btn.innerHTML=old,3000);}finally{btn.disabled=false;}}
    function jerseySlug(name){return String(name??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
    function jerseyUrl(name,big){if(!state.jerseys?.[teamKey(name)])return '';return `camisetas/${jerseySlug(name)}${big?'':'-mini'}.webp`;}
    function jerseyMini(name){const url=jerseyUrl(name,false);if(!url)return '';return `<img class="jersey-mini" src="${attr(url)}" alt="" loading="lazy" data-orig="${attr(state.jerseys[teamKey(name)])}" onerror="if(this.dataset.orig&&this.src!==this.dataset.orig){this.src=this.dataset.orig;}else{this.remove();}">`;}
    function teamKey(value){return String(value??'').trim().toUpperCase().replace(/\s+/g,' ');}
    function escape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}function attr(value){return escape(value).replace(/'/g,'&#39;');}
    load().catch(error=>{console.error(error);document.getElementById('app').innerHTML=`<div class="panel empty error">No se pudieron cargar los datos de Google Sheets.</div>`;});
  </script>
