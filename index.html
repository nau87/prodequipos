    function parseRanking(rows,rank,name,pj,points){return rows.map(row=>({puesto:str(row,rank),nombre:str(row,name),pj:num(row,pj),pts:num(row,points)})).filter(row=>row.nombre&&!row.nombre.startsWith('#'));}

    function renderComparison(){const first=document.getElementById('compare-a'),second=document.getElementById('compare-b');if(!first||!second)return;const type=document.querySelector('[data-compare-type].active')?.dataset.compareType||'player';const items=compareItems(type);const a=items[Number(first.value)],b=items[Number(second.value)];if(!a||!b)return;const nameA=type==='player'?a.nombre:a.equipo;const nameB=type==='player'?b.nombre:b.equipo;const metricRows=[['Puntos históricos',a.hist,b.hist],['Promedio',a.promedio.toFixed(2),b.promedio.toFixed(2)],['Fechas jugadas',type==='player'?a.fechas:Math.round(a.hist/(a.promedio||1)),type==='player'?b.fechas:Math.round(b.hist/(b.promedio||1))],['Mejor fecha',a.mejor,b.mejor],['Títulos',`${a.a+a.c+a.anual+(type==='player'?0:a.prov)?`★ ${a.a+a.c+a.anual+(type==='player'?0:a.prov)}`:'-'}`,`${b.a+b.c+b.anual+(type==='player'?0:b.prov)?`★ ${b.a+b.c+b.anual+(type==='player'?0:b.prov)}`:'-'}`]];const evolution=(item)=>{const logs=state.rawLogs.filter(log=>log.jugador===item.nombre).sort((x,y)=>{const dx=String(x.timestamp),dy=String(y.timestamp);return dx.localeCompare(dy);}).slice(-5);return logs.length?logs.map(log=>log.puntos).join(' → '):'Sin registros';};const evolutionHtml=type==='player'?`<div class="compare-evolution"><div class="evolution-box"><h3>${escape(nameA)} · Evolución reciente</h3><div class="evolution-values">${evolution(a)}</div></div><div class="evolution-box"><h3>${escape(nameB)} · Evolución reciente</h3><div class="evolution-values">${evolution(b)}</div></div></div>`:'';document.getElementById('comparison-output').innerHTML=`<div class="panel table-scroll"><table class="compare-table"><thead><tr><th>Métrica</th><th>${escape(nameA)}</th><th>${escape(nameB)}</th></tr></thead><tbody>${metricRows.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`).join('')}</tbody></table></div>${evolutionHtml}`;}

    function timestampMs(value){const sheetDate=String(value).match(/Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/);if(sheetDate)return new Date(...sheetDate.slice(1).map(Number)).getTime();const spanishDate=String(value).match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);if(spanishDate){const [,day,month,year,hour,minute,second]=spanishDate.map(Number);return new Date(year,month-1,day,hour,minute,second).getTime();}return Date.parse(value)||0;}
    function latestTeamPlayers(equipo){const byPlayer={};state.rawLogs.filter(log=>log.equipo.toUpperCase()===equipo.toUpperCase()).forEach(log=>{if(!byPlayer[log.jugador]||timestampMs(log.timestamp)>timestampMs(byPlayer[log.jugador].timestamp))byPlayer[log.jugador]=log;});return Object.values(byPlayer).map(log=>log.jugador).sort();}
    function currentCaptain(equipo){const teamLogs=state.rawLogs.filter(log=>log.equipo.toUpperCase()===equipo.toUpperCase()&&log.capitan);if(!teamLogs.length)return '';return teamLogs.reduce((latest,log)=>timestampMs(log.timestamp)>timestampMs(latest.timestamp)?log:latest).jugador;}
    function openProfile(type,name){const modal=document.getElementById('profile-modal');if(type==='player'){const stat=state.statsPlayers.find(row=>row.nombre===name);const recent=state.rawLogs.filter(log=>log.jugador===name).sort((a,b)=>timestampMs(b.timestamp)-timestampMs(a.timestamp)).slice(0,3);const championships=[['Apertura',stat?.a||0],['Clausura',stat?.c||0],['Anual',stat?.anual||0],['Provincial',0]];const championshipsHtml=`<div class="championships"><h3>CAMPEONATOS GANADOS</h3>${championships.map(([torneo,count])=>`<div class="championship"><b>${torneo.toUpperCase()}</b><span>${count?'★'.repeat(count):'-'}</span></div>`).join('')}</div>`;const content=`<div class="info-grid"><div class="info"><b>${stat?.hist||0}</b><span>Puntos históricos</span></div><div class="info"><b>${stat?.promedio?.toFixed(2)||'0.00'}</b><span>Promedio</span></div><div class="info"><b>${stat?.fechas||0}</b><span>Fechas jugadas</span></div></div><p><b>Equipo actual:</b> ${escape(stat?.equipo||'LIBRE')}</p>${championshipsHtml}<h3>Últimos registros</h3>${recent.length?recent.map(log=>`<div class="list-row"><span>${escape(log.torneo)} · Fecha ${log.fecha}</span><b>${log.puntos} pts</b></div>`).join(''):'<p class="sub">Sin registros.</p>'}`;modal.innerHTML=modalHtml(name,'Ficha de jugador',content);}else{const stat=state.statsTeams.find(row=>row.equipo===name);const players=latestTeamPlayers(name);const captain=currentCaptain(name);const championships=[['Apertura',stat?.a||0],['Clausura',stat?.c||0],['Anual',stat?.anual||0],['Provincial',stat?.prov||0]];const championshipsHtml=`<div class="championships"><h3>CAMPEONATOS GANADOS</h3>${championships.map(([torneo,count])=>`<div class="championship"><b>${torneo.toUpperCase()}</b><span>${count?'★'.repeat(count):'-'}</span></div>`).join('')}</div>`;const content=`<div class="info-grid"><div class="info"><b>${stat?.hist||0}</b><span>Puntos históricos</span></div><div class="info"><b>${stat?.promedio?.toFixed(2)||'0.00'}</b><span>Promedio</span></div><div class="info"><b>${stat?.mejor||0}</b><span>Mejor fecha</span></div></div>${championshipsHtml}${captain?`<p class="captain"><b>Capitán actual:</b> ${escape(captain)}</p>`:''}<h3>Integrantes actuales (${players.length})</h3><p class="roster">${players.length?players.map(escape).join(' · '):'Sin integrantes registrados.'}</p>`;modal.innerHTML=modalHtml(name,'Ficha de equipo',content);}modal.showModal();}
    function modalHtml(title,subtitle,content){return `<div class="modal-head"><div><h2>${escape(title)}</h2><p>${subtitle}</p></div><button class="close" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button></div><div class="modal-body">${content}</div>`;}
    function escape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}function attr(value){return escape(value).replace(/'/g,'&#39;');}
    load().catch(error=>{console.error(error);document.getElementById('app').innerHTML=`<div class="panel empty error">No se pudieron cargar los datos de Google Sheets.</div>`;});
  </script>
</body>
