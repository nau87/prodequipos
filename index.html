    function parseLogs(logs){state.rawLogs=logs.filter(row=>str(row,0)&&str(row,0).toUpperCase()!=='JUGADOR').map(row=>{const id=str(row,9).match(/_(\d{4})_([A-ZÁÉÍÓÚ]+)_([A-ZÁÉÍÓÚ]+)_F?(\d+)$/i)||[];return {jugador:str(row,0),fecha:num(row,1)||Number(id[4])||0,puntos:num(row,2),suma:num(row,3),torneo:(str(row,4)||id[2]||'').toUpperCase(),competencia:(str(row,5)||id[3]||'').toUpperCase(),timestamp:str(row,6),equipo:str(row,7)||'LIBRE',capitan:str(row,8).toUpperCase()==='SI',temporada:str(row,11)||id[1]||''};});state.logsLoaded=true;}

    function teamTitle(key){return key==='anual'?'Tabla Anual':key[0].toUpperCase()+key.slice(1)+' de Equipos';}
    function teamView(key,inner){const rows=state.teams[key];const tieTip='Empate en puntos. La posición fue definida por los criterios de desempate de la organización.';const annual=key==='anual';const body=rows.length?rows.map((row,index)=>{const tied=index>0&&row.pts===rows[index-1].pts;return annual?`<tr data-team="${attr(row.equipo)}"><td class="center rank">${row.puesto}${tied?`<span class="tag" tabindex="0" role="button" aria-label="${tieTip}" data-tip="${tieTip}">i</span>`:''}</td><td class="team"><span class="name-with-jersey">${jerseyMini(row.equipo)}<button class="profile-link" onclick="openProfile('team','${attr(row.equipo)}')">${escape(row.equipo)}</button></span></td><td class="center points">${row.pts}</td></tr>`:`<tr data-team="${attr(row.equipo)}"><td class="center rank">${row.puesto}${tied?`<span class="tag" tabindex="0" role="button" aria-label="${tieTip}" data-tip="${tieTip}">i</span>`:''}</td><td class="team"><span class="name-with-jersey">${jerseyMini(row.equipo)}<button class="profile-link" onclick="openProfile('team','${attr(row.equipo)}')">${escape(row.equipo)}</button></span></td><td class="center points">${row.pts}</td><td class="center"><button class="icon-btn" onclick="openTeamDetail('${key}','${attr(row.equipo)}')">Ver equipo</button></td></tr>`;}).join(''):`<tr><td colspan="${annual?3:4}" class="empty">Todavía no hay datos para esta temporada.</td></tr>`; const regular=annual?`<div class="panel table-scroll"><table class="teams-table"><thead><tr><th class="center">#</th><th>Equipo</th><th class="center">PTS</th></tr></thead><tbody>${body}</tbody></table></div>`:`<div class="panel table-scroll"><table class="teams-table"><thead><tr><th class="center">#</th><th>Equipo</th><th class="center">PTS</th><th class="center"></th></tr></thead><tbody>${body}</tbody></table></div>`;const note=annual?'<p class="note">Pts Apertura + Pts Clausura + Pts Provincial.</p>':'<p class="note">El indicador <b>i</b> señala puntos iguales. Criterios de desempa     function historyView(kind){const isPlayer=kind==='jugadores';const rows=isPlayer?state.statsPlayers:state.statsTeams;const title=isPlayer?'Ranking histórico de jugadores':'Ranking histórico de equipos';const headers=isPlayer?'<th class="center">#</th><th>Jugador</th><th class="center">Títulos</th><th class="center">PTS</th><th class="center">PJ</th><th class="center">PROM</th><th class="center">MEJOR</th><th class="center">IDEAL</th>':'<th class="center">#</th><th>Equipo</th><th class="center">Títulos</th><th class="center">PTS</th><th class="center">PJ</th><th class="center">PROM</th><th class="center">MEJOR</th>';const content=rows.slice().sort((a,b)=>b.hist-a.hist).map(row=>{const titles=row.a+row.c+row.anual+row.prov;const stars=titles?`<span class="title-count" title="${titles} campeonato${titles>1?'s':''} obtenido${titles>1?'s':''}"><span class="star">★</span>${titles}</span>`:'<span class="sub">-</span>';const movement=row.anterior-row.puesto;const trend=movement>0?'<span class="trend up" title="Subió posiciones">↑</span>':movement<0?'<span class="trend down" title="Bajó posiciones">↓</span>':'<span class="trend same" title="Mantuvo la posición">→</span>';const profileType=isPlayer?'player':'team';const profileName=isPlayer?row.nombre:row.equipo;const nameCell=`<span class="name-with-jersey">${isPlayer?'':jerseyMini(profileName)}<button class="profile-link" onclick="openProfile('${profileType}','${attr(profileName)}')">${escape(profileName)}</button></span>`;const rankCell=`<span class="rank-with-trend">${row.puesto||'-'}${trend}</span>`;return isPlayer?`<tr data-player="${attr(row.nombre)}"><td class="center">${rankCell}</td><td class="team">${nameCell}</td><td class="center">${stars}</td><td class="center points">${row.hist}</td><td class="center">${row.fechas}</td><td class="center">${row.promedio.toFixed(2)}</td><td class="center">${row.mejor}</td><td class="center">${row.ideal}</td></tr>`:`<tr data-team="${attr(row.equipo)}"><td class="center">${row.     function evolutionChart(points){if(!points.length)return '<p class="sub">Sin fechas registradas esta temporada.</p>';const n=points.length;const narrow=window.matchMedia('(max-width:700px)').matches;const W=narrow?Math.max(330,n*26):Math.max(640,n*20),H=narrow?200:220,L=30,R=16,T=22,B=28;const max=Math.max(1,...points.map(p=>p.value));const top=max<=10?Math.ceil(max/2)*2:Math.ceil(max/5)*5;const x=i=>n===1?(L+W-R)/2:L+(W-L-R)*i/(n-1);const y=v=>T+(H-T-B)*(1-v/top);const avg=points.reduce((sum,p)=>sum+p.value,0)/n;const step=!narrow&&n>24?2:1;const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#edf0ed"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#71807c">${Math.round(v)}</text>`).join('');const separators=points.map((p,i)=>i>0&&p.torneo!==points[i-1].torneo?`<line x1="${(x(i)+x(i-1))/2}" x2="${(x(i)+x(i-1))/2}" y1="${T-8}" y2="${H-B}" stroke="#c9d3ce" stroke-dasharray="2 3"/>`:'').join('');const line=n>1?`<polyline fill="none" stroke="#17734d" stroke-width="2" stroke-linejoin="round" points="${points.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ')}"/>`:'';const avgLine=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="#b7791f" stroke-dasharray="5 4" stroke-width="1.2"/>`;const dots=points.map((p,i)=>`<g class="chart-pt" data-tip="${attr(p.title)}"><circle class="hit" cx="${x(i)}" cy="${y(p.value)}" r="11" fill="transparent"/><circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="3.6" fill="#fff" stroke="#17734d" stroke-width="2"/><text x="${x(i)}" y="${y(p.value)-8}" text-anchor="middle" font-size="${n>30?9:10}" fill="#1d2a27">${p.value}</text></g>`).join('');const labels=points.map((p,i)=>(n-1-i)%step===0?`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#71807c">${escape(p.label)}</text>`:'').join('');return `<div class="chart-wrap${narrow&&W>330?' many':''}" style="--minw:${W}px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos por fecha">${gri     document.addEventListener('pointerout',event=>{const point=event.target.closest?.('.chart-pt');if(point&&event.pointerType==='mouse'&&!point.contains(event.relatedTarget))hideChartTips();});
    document.addEventListener('click',event=>{const point=event.target.closest?.('.chart-pt');if(point)showChartTip(point);else if(!event.target.closest?.('.chart-tip'))hideChartTips();});
    const DEFAULT_RULES=[{"titulo": "Cómo se juega", "texto": "Cada fecha, el jugador selecciona LOCAL, EMPATE o VISITA en 10 partidos.\nEn uno de esos 10 partidos debe seleccionar 2 opciones posibles. Ej.: LOCAL / EMPATE.\n- 1 punto por cada acierto, con un máximo de 10 puntos por fecha.\n- En el partido con doble opción, el acierto cuenta si sale cualquiera de las dos."}, {"titulo": "Cierre, suspensiones y jugadas", "texto": "Cierre de predicciones: todos los sábados a las 13:00 horas. En caso de alguna excepción, se avisará en el grupo de WhatsApp.\nPartidos suspendidos o postergados: la fecha queda en suspenso hasta que se complete el o los partidos suspendidos.\nMás de una jugada por persona: si un jugador envía 2 predicciones, se computan como \"Jugador Ejemplo\" y \"Jugador Ejemplo 2\". Cada predicción es un jugador distinto."}, {"titulo": "Premios semanales", "texto": "Cada jugador compite cada semana por premios en efectivo o jugadas gratis:\n- 10 pts: $550.000 (se divide entre los jugadores con el mismo puntaje)\n- 9 pts: $250.000 (se divide entre los jugadores con el mismo puntaje)\n- 8 pts: $100.000 (se divide entre los jugadores con el mismo puntaje)\n- 7 pts: Jugada gratis\nTerminada la fecha, se sube la información al grupo de WhatsApp con los datos y los nombres de los ganadores (si los hubo).\nLos ganadores deben comunicarse por privado con el administrador del grupo para cobrar el premio que les corresponda."}, {"titulo": "Torneos individuales", "texto": "Cada jugador del prode compite individualmente con su puntaje en distintos torneos. Para una mejor organización, los torneos llevan el nombre del torneo que se juega en ese momento en la Liga Pampeana:\n- APERTURA (primera mitad del año): camiseta actual de Primera División.\n- CLAUSURA (segunda mitad del año): camiseta actual de Primera División.\n- PROVINCIAL (final del año): camiseta actual de Primera División + cena para 2 personas en la sede.\n- ANUAL (tabla que suma los 3 anteriores): voucher de sponsor."}, {"titulo": "Desempate individual", "texto": "En caso de empate en puntos de 2 o más jugadores en la primera posición, se aplican los siguientes criterios:\n1) Más fechas ganadas (si dos o más jugadores comparten el puntaje más alto de una fecha, la fecha cuenta como ganada para todos ellos).\n2) Más fechas ganadas entre sí (se comparan solo las fechas que jugaron los jugadores empatados; las fechas con igual puntaje no cuentan).\n3) Mejor fecha (mayor puntaje obtenido en una sola fecha del torneo)."}, {"titulo": "Modalidad en equipos", "texto": "Un equipo se conforma con 5 jugadores que se agrupan para sumar juntos fecha tras fecha.\nEligen un nombre (recomendamos que sea el nombre de un negocio local).\nDeben designar un CAPITÁN, que sumará su puntaje x2 (ej.: si el capitán hace 5 pts, suma 10 para el equipo).\nEl capitán puede cambiar fecha a fecha, siempre y cuando el cambio se le comunique al administrador del grupo de WhatsApp antes del cierre de predicciones."}, {"titulo": "Apertura, Clausura y Anual de equipos", "texto": "- APERTURA (primera mitad del año): el campeón pasa a la final.\n- CLAUSURA (segunda mitad del año): el campeón pasa a la final.\n- ANUAL: final de ida y vuelta entre el campeón del Apertura y el campeón del Clausura. Si el mismo equipo gana el Apertura y el Clausura, es el campeón anual y no se juega la final.\nCriterios de desempate del Apertura y el Clausura: 1) Puntos totales, 2) Más fechas ganadas, 3) Mejor fecha."}, {"titulo": "Provincial de equipos", "texto": "🏆 Fase regular (6 fechas): todos los equipos suman puntos en una única tabla general.\nCriterios de desempate: 1) Puntos totales, 2) Más fechas ganadas, 3) Mejor fecha.\n🔥 Playoffs (cruces mano a mano): al finalizar la fecha 6, los 8 mejores clasificados pasan a los playoffs. Los cruces se juegan con partidos de ida y vuelta:\n- 1° vs. 8°\n- 3° vs. 6°\n- 4° vs. 5°\n- 2° vs. 7°\nEn caso de empate en puntos después de los partidos de ida y vuelta, pasa de ronda el equipo mejor ubicado en la tabla de la fase regular."}, {"titulo": "Premios por equipo", "texto": "- APERTURA: clasifica a la final del torneo Anual.\n- CLAUSURA: clasifica a la final del torneo Anual.\n- ANUAL: cena para los 5 integrantes del equipo en la sede del club.\n- PROVINCIAL: cena para los 5 integrantes del equipo en la sede del club, más un objeto de reconocimiento simbólico."}, {"titulo": "Cláusula final", "texto": "Cualquier situación no prevista en este reglamento será resuelta por la organización."}];
    function rulesText(text){const lines=String(text).split(/\n+/).map(line=>line.trim()).filter(Boolean);let html='',list='';const flush=()=>{if(list){html+=list+'</ul>';list='';}};lines.forEach(line=>{const item=line.match(/^(?:[-•*]|\d+[).])\s*(.*)$/);if(item){if(!list)list=/^\d/.test(line)?'<ul class="num">':'<ul>';list+=`<li>${escape(line.match(/^\d/)?line:item[1])}</li>`;}else{flush();const label=line.match(/^([^:]{3,55}):\s+(.*)$/);html+=label?`<p><b>${escape(label[1])}:</b> ${escape(label[2])}</p>`:`<p>${escape(line)}</p>`;}});flush();return html;}
    function rulesView(){const sections=DEFAULT_RULES.map(rule=>({...rule}));(state.rules||[]).forEach(rule=>{const existing=sections.find(item=>teamKey(item.titulo)===teamKey(rule.titulo));if(existing)existing.texto=rule.texto;else sections.push(rule);});return `<section class="view" id="view-reglamento"><div class="section-head"><div><h2>Reglamento</h2><p>Prode Club All Boys · Cómo se juega, premios y desempates.</p></div></div><div class="rules">${sections.map(rule=>`<div class="panel rule"><h3>${escape(rule.titulo)}</h3>${rulesText(rule.texto)}</div>`).join('')}</div></section>`;}
    function modalHtml(title,subtitle,content){return `<div class="modal-head"><div><h2>${escape(title)}</h2><p>${subtitle}</p></div><button class="close" onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button></div><div class="modal-body">${content}</div>`;}
    function lastDateDetail(equipo){const sm=state.summary;const logs=state.rawLogs.filter(log=>log.temporada===sm.season&&log.torneo===String(sm.torneo).toUpperCase()&&log.competencia===String(sm.competencia).toUpperCase()&&String(log.fecha)===String(sm.fecha)&&log.equipo.toUpperCase()===equipo.toUpperCase()).sort((a,b)=>b.suma-a.suma||a.jugador.localeCompare(b.jugador));const title=`<h3>Última fecha · ${escape(torneoName(String(sm.torneo).toUpperCase()))} · Fecha ${escape(sm.fecha)}</h3>`;if(!logs.length)return `${title}<p class="sub">Este equipo no tiene puntajes cargados en la última fecha.</p>`;const total=logs.reduce((sum,log)=>sum+log.suma,0);return `${title}<div class="table-scroll"><table class="last-date"><thead><tr><th>Jugador</th><th class="center">PTS</th><th class="center">Suma</th></tr></thead><tbody>${logs.map(log=>`<tr><td class="team">${escape(log.jugador)}${log.capitan?' <span class="cap">C</span>':''}</td><td class="center">${log.puntos}</td><td class="center points">${log.suma}</td></tr>`).join('')}<tr class="total"><td>Total del equipo</td><td></td><td class="center points">${total}</td></tr></tbody></table></div><p class="note">El capitán (C) suma doble.</p>`;}
    function jerseySlug(name){return String(name??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
    function jerseyUrl(name,big){if(!state.jerseys?.[teamKey(name)])return '';return `camisetas/${jerseySlug(name)}${big?'':'-mini'}.webp`;}
    function jerseyMini(name){const url=jerseyUrl(name,false);if(!url)return '';return `<img class="jersey-mini" src="${attr(url)}" alt="" loading="lazy" data-orig="${attr(state.jerseys[teamKey(name)])}" onerror="if(this.dataset.orig&&this.src!==this.dataset.orig){this.src=this.dataset.orig;}else{this.remove();}">`;}
    function teamKey(value){return String(value??'').trim().toUpperCase().replace(/\s+/g,' ');}
    function escape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}function attr(value){return escape(value).replace(/'/g,'&#39;');}
    load().catch(error=>{console.error(error);document.getElementById('app').innerHTML=`<div class="panel empty error">No se pudieron cargar los datos de Google Sheets.</div>`;});
  </script>
